<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - 故纸堆</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ '/blog/css/blog.css' | relative_url }}">

    {% if page.math or page.latex %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" 
            onload="renderMathInElement(document.body);"></script>
    {% endif %}
</head>
<body>

    <header class="blog-header">
        <div class="header-container">
            <a href="{{ '/blog/index.html' | relative_url }}" class="back-home">← 别处看看</a>
            
            <div class="reader-controls">
                <button id="font-toggle" class="control-btn" title="切换衬线/非衬线">A</button>
                
                <div class="theme-selector">
                    <button class="theme-btn btn-dark active" data-theme="dark" title="深色模式"></button>
                    <button class="theme-btn btn-white" data-theme="white" title="纯白模式"></button>
                    <button class="theme-btn btn-sepia" data-theme="sepia" title="羊皮纸模式"></button>
                </div>
            </div>
        </div>
    </header>

    <main class="blog-main-container">
        <article class="blog-post-content">
            <header class="post-entry-header">
                <div class="post-meta">
                    {{ page.date | date: "%Y年%m月%d日" }}
                    {% if page.categories.size > 0 %}
                        · {{ page.categories | join: ", " }}
                    {% endif %}
                </div>
                <h1 class="post-title" style="font-size: 36px; margin: 10px 0 30px 0;">{{ page.title }}</h1>
            </header>

            <div class="entry-content">
                {{ content }}
            </div>
        </article>
    </main>

    <footer class="blog-footer">
        <p>© 2026 Powerby Jekyll & GitHub Pages</p>
    </footer>

    <script src="{{ '/blog/js/blog-theme.js' | absolute_url }}" defer></script>
</body>
</html>
