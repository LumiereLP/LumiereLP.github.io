# Pages CMS 配置：登录 https://app.pagescms.org 用 GitHub 账号授权本仓库后，即可在浏览器里写博客
media:
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: 博客文章
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{fields.slug}.md"
    view:
      fields: [title, date, categories]
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: slug
        label: 英文短名（用于网址和文件名，如 acid-base）
        type: string
        required: true
      - name: date
        label: 日期
        type: date
        options:
          time: true
          format: "yyyy-MM-dd HH:mm"
      - name: categories
        label: 分类
        type: string
        default: 学术笔记
      - name: body
        label: 正文
        type: code
        options:
          language: markdown
