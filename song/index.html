<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>唱片机</title>
    <link rel="icon" href="../assets/images/icons/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-sans: "Figtree", "Noto Sans SC", sans-serif;
            --bg-color: #121212;
            --text-color: #f5f7ff;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            min-height: 100vh;
        }

        .song-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            box-sizing: border-box;
        }

        .back-home {
            display: inline-block;
            color: #888888;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 2rem;
            transition: color 0.3s;
        }
        .back-home:hover {
            color: #ffffff;
        }

        /* 歌曲信息区域 */
        .song-meta {
            margin-bottom: 2rem;
            animation: fadeIn 0.6s ease-out;
        }

        .song-title {
            font-size: 34px;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.5px;
        }

        .song-artist {
            font-size: 16px;
            color: #888888;
            margin: 0;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; 
            background: #000;
            border-radius: 0px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.8s ease-out;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0 !important;
        }

        .song-specs {
            font-family: var(--font-sans);
            font-size: 13px;
            color: #666666;
            margin-top: 0.8rem;
        }

        .spec-separator {
            margin: 0 0.6rem;
            color: #333333;
        }

        .song-specs span span {
            color: #aaaaaa;
        }
        .shuffle-btn {
            display: inline-block;
            margin-top: 1.2rem;
            padding: 0.45rem 1.1rem;
            background: transparent;
            color: #aaaaaa;
            border: 1px solid #333333;
            border-radius: 999px;
            font-family: var(--font-sans);
            font-size: 14px;
            cursor: pointer;
            transition: color 0.3s, border-color 0.3s;
        }
        .shuffle-btn:hover {
            color: #ffffff;
            border-color: #888888;
        }
        .shuffle-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .error-message {
            text-align: center;
            margin-top: 20vh;
            color: #4d6eff;
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="song-container">
        <a href="../index.html" class="back-home">← 神秘地点</a>

        <div id="player-content">
            <div class="song-meta">
                <h1 class="song-title" id="title">正在同步电波...</h1>
                <p class="song-artist" id="artist">Loading...</p>
            </div>
            <div class="song-specs">
                <span class="spec-item">时长: <span id="length">--:--</span></span>
                <span class="spec-separator"><br></span>
                <span class="spec-item">bpm: <span id="bpm">--</span></span>
                <span id="source-container" style="display: none;">
                    <span class="spec-item"><br>来源: <span id="source"></span></span>
                </span>
            </div>
            <button type="button" class="shuffle-btn" id="shuffle-btn" disabled>换一首 ↻</button>
            <div class="video-wrapper" id="video-container" style="margin-top: 2rem; margin-bottom: 2rem;">
                </div>
        </div>
    </div>

    <script src="../assets/js/song-picker.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const shuffleBtn = document.getElementById('shuffle-btn');
            let songs = [];
            let currentId = new URLSearchParams(window.location.search).get('id');

            if (!currentId) {
                showError('未找到对应的歌曲信号');
                return;
            }

            fetch('../songs.json')
                .then(response => {
                    if (!response.ok) throw new Error();
                    return response.json();
                })
                .then(data => {
                    songs = data;
                    render(currentId);
                    shuffleBtn.disabled = songs.length < 2;
                })
                .catch(() => {
                    showError('无法加载核心数据库，请检查网络连接');
                });

            shuffleBtn.addEventListener('click', function() {
                const next = SongPicker.pick(songs, currentId);
                if (!next) return;
                history.pushState(null, '', '?id=' + next.id);
                render(next.id);
            });

            // 浏览器前进/后退时同步显示对应歌曲
            window.addEventListener('popstate', function() {
                const id = new URLSearchParams(window.location.search).get('id');
                if (id && songs.length) render(id);
            });

            function render(songId) {
                const song = songs.find(s => s.id == songId);
                if (!song) {
                    showError('该神秘歌曲已从数据库中抹去 (ID: ' + songId + ')');
                    return;
                }
                currentId = song.id;
                SongPicker.markPlayed(song.id);

                document.getElementById('title').textContent = song.title;
                document.getElementById('artist').textContent = song.artist;
                document.getElementById('length').textContent = song.length || '--:--';
                if (song.bpm && song.bpm !== '0' && song.bpm !== 0) {
                    document.getElementById('bpm').textContent = song.bpm;
                } else {
                    document.getElementById('bpm').textContent = '--';
                }
                document.getElementById('video-container').innerHTML = song.embed;
                const sourceContainer = document.getElementById('source-container');
                if (song.source && song.source.trim() !== '') {
                    document.getElementById('source').textContent = song.source;
                    sourceContainer.style.display = 'inline'; // 有数据则显示出来
                } else {
                    sourceContainer.style.display = 'none';  // 无数据则隐形
                }
            }

            function showError(msg) {
                document.getElementById('player-content').innerHTML = `
                    <div class="error-message">
                        <h2>Error</h2>
                        <p>${msg}</p>
                        <a href="../index.html" style="color: #f5f7ff; text-decoration: underline;">回到安全区</a>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
